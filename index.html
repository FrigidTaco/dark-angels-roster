<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Angels of Caliban - Roster & Armor Tracker</title>
  <style>
    :root {
      --caliban-green: #0a2f1d;
      --bone-white: #e3dac9;
      --dark-bg: #121212;
      --card-bg: #1e1e1e;
      --border-color: #2a2a2a;
      --text-main: #e0e0e0;
      --text-muted: #aaaaaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 90px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--caliban-green);
      padding-bottom: 16px;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--bone-white);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .search-bar {
      width: 100%;
      padding: 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .search-bar:focus { outline: 1px solid var(--caliban-green); }

    .roster-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 768px) { .roster-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1200px) { .roster-grid { grid-template-columns: repeat(3, 1fr); } }

    .member-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .member-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .member-info h2 { font-size: 1.2rem; color: var(--bone-white); }
    .member-info p { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

    .rank-badge {
      background-color: var(--caliban-green);
      color: var(--bone-white);
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .armor-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .armor-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .armor-item {
      display: flex;
      align-items: center;
      background: #181818;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .armor-item.earned {
      background-color: rgba(10, 47, 29, 0.3);
      border-color: var(--caliban-green);
      color: var(--bone-white);
    }

    .armor-item.earned .status-dot {
      background-color: #2ecc71;
      box-shadow: 0 0 6px #2ecc71;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #555;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .floating-actions {
      position: fixed;
      bottom: 16px;
      right: 16px;
      left: 16px;
      display: flex;
      gap: 12px;
      justify-content: center;
      z-index: 10;
    }

    .btn {
      background-color: var(--caliban-green);
      color: var(--bone-white);
      border: none;
      padding: 14px 24px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      flex: 1;
      max-width: 200px;
      text-align: center;
    }

    .btn-secondary { background-color: #333; color: #fff; }

    .custom-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      align-items: center; justify-content: center;
      padding: 16px; z-index: 1000;
    }

    .custom-modal-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px; padding: 24px; width: 100%; max-width: 450px;
    }

    .custom-modal-box h3 { color: var(--bone-white); margin-bottom: 16px; font-size: 1.25rem; }
    .input-row { margin-bottom: 16px; }
    .input-row label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    
    .field-box { 
      width: 100%; padding: 12px; background-color: #181818; 
      border: 1px solid var(--border-color); border-radius: 6px; 
      color: #fff; font-size: 1rem; outline: none;
    }
    .field-box:focus { border-color: var(--caliban-green); }
    .action-row { display: flex; gap: 12px; margin-top: 24px; }
    .action-row .btn { flex: 1; max-width: none; }
  </style>
</head>
<body>

  <header>
    <h1>Dark Angels of Caliban</h1>
    <p>Roster & Armor Quest Achievement Tracker</p>
  </header>

  <input type="text" id="search" class="search-bar" placeholder="Filter battle-brothers by name, rank, or position...">

  <div class="roster-grid" id="rosterGrid"></div>

  <div class="floating-actions">
    <button type="button" class="btn" id="openPanelBtn">+ Add Brother</button>
    <button type="button" class="btn btn-secondary" id="exportBtn">Export Data</button>
  </div>

  <div class="custom-modal-overlay" id="brotherModal">
    <div class="custom-modal-box">
      <h3>Induct New Battle-Brother</h3>
      
      <div class="input-row">
        <label>Name</label>
        <input type="text" id="brotherName" class="field-box" placeholder="e.g., Brother Balthasar">
      </div>

      <div class="input-row">
        <label>Rank</label>
        <select id="brotherRank" class="field-box">
          <option value="Grand Master">Grand Master</option>
          <option value="Master">Master</option>
          <option value="Interrogator-Chaplain">Interrogator-Chaplain</option>
          <option value="Librarian">Librarian</option>
          <option value="Company Champion">Company Champion</option>
          <option value="Veteran Brother">Veteran Brother</option>
          <option value="Battle-Brother" selected>Battle-Brother</option>
          <option value="Neophyte">Neophyte</option>
        </select>
      </div>

      <div class="input-row">
        <label>Position / Role</label>
        <input type="text" id="brotherPosition" class="field-box" placeholder="e.g., 3rd Company, Tactical Squad Lead">
      </div>

      <div class="action-row">
        <button type="button" class="btn btn-secondary" id="closePanelBtn">Cancel</button>
        <button type="button" class="btn" id="saveBrotherBtn">Add to Roster</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      let roster = [
        {
          id: 1,
          name: "Grand Master Azrael",
          rank: "Grand Master",
          position: "Supreme Chapter Commander",
          armor: { Studs: true, Helm: true, Breastplate: true, Pauldrons: true, Backpack: true, Wargear: true, Arms: true, Legs: true }
        },
        {
          id: 2,
          name: "Brother Asmodai",
          rank: "Interrogator-Chaplain",
          position: "Master of Repentance",
          armor: { Studs: false, Helm: true, Breastplate: true, Pauldrons: true, Backpack: false, Wargear: true, Arms: true, Legs: true }
        }
      ];

      const armorCategories = ["Studs", "Helm", "Breastplate", "Pauldrons", "Backpack", "Wargear", "Arms", "Legs"];

      if (localStorage.getItem('da_roster_data')) {
        try {
          roster = JSON.parse(localStorage.getItem('da_roster_data'));
        } catch(e) { console.error(e); }
      }

      function saveToStorage() {
        localStorage.setItem('da_roster_data', JSON.stringify(roster));
      }

      function renderRoster(filterText = '') {
        const grid = document.getElementById('rosterGrid');
        if (!grid) return;
        grid.innerHTML = '';

        const filtered = roster.filter(m => 
          m.name.toLowerCase().includes(filterText.toLowerCase()) ||
          m.rank.toLowerCase().includes(filterText.toLowerCase()) ||
          m.position.toLowerCase().includes(filterText.toLowerCase())
        );

        filtered.forEach(member => {
          const card = document.createElement('div');
          card.className = 'member-card';

          const header = document.createElement('div');
          header.className = 'member-header';
          
          const info = document.createElement('div');
          info.className = 'member-info';
          info.innerHTML = `<h2>${member.name}</h2><p>${member.position}</p>`;
          
          const badge = document.createElement('span');
          badge.className = 'rank-badge';
          badge.innerText = member.rank;

          header.appendChild(info);
          header.appendChild(badge);
          card.appendChild(header);

          const armorTitle = document.createElement('div');
          armorTitle.className = 'armor-title';
          armorTitle.innerText = "Earned Armor Pieces";
          card.appendChild(armorTitle);

          const list = document.createElement('div');
          list.className = 'armor-list';

          armorCategories.forEach(cat => {
            const item = document.createElement('div');
            const isEarned = member.armor[cat] || false;
            item.className = `armor-item ${isEarned ? 'earned' : ''}`;
            item.innerHTML = `<span class="status-dot"></span>${cat}`;
