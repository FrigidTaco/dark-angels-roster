<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Angels of Caliban - Roster & Quest Tracker</title>
  <style>
    :root {
      --caliban-green: #0a2f1d;
      --bone-white: #e3dac9;
      --dark-bg: #121212;
      --card-bg: #1e1e1e;
      --border-color: #2a2a2a;
      --text-main: #e0e0e0;
      --text-muted: #aaaaaa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--dark-bg); color: var(--text-main); padding: 16px; padding-bottom: 90px; }
    header { text-align: center; margin-bottom: 24px; border-bottom: 2px solid var(--caliban-green); padding-bottom: 16px; }
    header h1 { font-size: 1.5rem; color: var(--bone-white); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
    header p { font-size: 0.85rem; color: var(--text-muted); }
    .search-bar { width: 100%; padding: 12px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); margin-bottom: 20px; font-size: 1rem; }
    .search-bar:focus { outline: 1px solid var(--caliban-green); }
    .roster-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 768px) { .roster-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1200px) { .roster-grid { grid-template-columns: repeat(3, 1fr); } }
    .member-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .floating-actions { position: fixed; bottom: 16px; right: 16px; left: 16px; display: flex; gap: 12px; justify-content: center; z-index: 10; }
    .btn { background-color: var(--caliban-green); color: var(--bone-white); border: none; padding: 14px 24px; border-radius: 25px; font-weight: bold; font-size: 0.9rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); flex: 1; max-width: 200px; text-align: center; }
    .btn-secondary { background-color: #333; color: #fff; }
    .custom-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
    .custom-modal-box { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 24px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; }
    .input-row { margin-bottom: 16px; }
    .input-row label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .field-box { width: 100%; padding: 12px; background-color: #181818; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 1rem; outline: none; }
    .action-row { display: flex; gap: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>Dark Angels of Caliban</h1>
    <p>Roster & Custom Armor Quest Tracker</p>
  </header>
  <input type="text" id="search" class="search-bar" placeholder="Filter battle-brothers by name, rank, or position..." oninput="window.handleSearch(this.value)">
  <div class="roster-grid" id="rosterGrid"></div>
  <div class="floating-actions">
    <button type="button" class="btn" onclick="window.openModal()">+ Add Brother</button>
    <button type="button" class="btn btn-secondary" onclick="window.exportData()">Export Data</button>
  </div>
  <div class="custom-modal-overlay" id="brotherModal">
    <div class="custom-modal-box">
      <h3>Induct New Battle-Brother</h3>
      <div class="input-row"><label>Name</label><input type="text" id="brotherName" class="field-box" placeholder="e.g., Brother Balthasar"></div>
      <div class="input-row"><label>Rank Selection</label><select id="brotherRank" class="field-box"><option value="Battle Brother" selected>Battle Brother</option></select></div>
      <div class="input-row"><label>Position / Role</label><input type="text" id="brotherPosition" class="field-box" placeholder="e.g., 3rd Company"></div>
      <div class="action-row"><button type="button" class="btn btn-secondary" onclick="window.closeModal()">Cancel</button><button type="button" class="btn" onclick="window.addMember()">Add to Roster</button></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
